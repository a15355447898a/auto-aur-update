name: auto-aur-update
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"


jobs:
  # This workflow contains a single job called "build"



  UpdatePkg:
    strategy:
      fail-fast: false
      matrix:
        PKGBUILDs:
        - mrrss-appimage
        - orca-note-appimage
        - any-code-appimage
        - openchamber-desktop-appimage

    runs-on: ubuntu-latest
#    if: github.event.repository.owner.id == github.event.sender.id  # 自己点的 start


    steps:
      - uses: actions/checkout@v2
      - uses: ./build-aur-action
        with:
          pkgname: ${{ matrix.PKGBUILDs }}
          pkgdir: ${{ matrix.PKGBUILDs }}

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@master
        with:
          pkgname: ${{ matrix.PKGBUILDs }}
          pkgbuild: ${{ matrix.PKGBUILDs }}/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update AUR package
          ssh_keyscan_types: rsa,ecdsa,ed25519
          allow_empty_commits: false
          updpkgsums: true

      - name: Commit and push updated PKGBUILD
        run: |
          git config --local user.name "a15355447898a"
          git config --local user.email "a15355447898a@outlook.com"
          git remote set-url origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add "${{ matrix.PKGBUILDs }}/PKGBUILD" "${{ matrix.PKGBUILDs }}/.SRCINFO"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update ${{ matrix.PKGBUILDs }}"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main || true
            if git push origin HEAD:main; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push conflict, retry $i"
            sleep 5
          done
          echo "Failed to push after retries"
          exit 1

  Task:
    needs: UpdatePkg
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Make Time log
      run: |
        echo `date +"%Y-%m-%d %H:%M:%S"` begin > time.log

    - name: Commit and Push
      run: |
        git config --local user.email a15355447898a@outlook.com
        git config --local user.name a15355447898a
        git add time.log
        git commit -m "update new time.log" || exit 0
        git pull --rebase origin main
        git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
